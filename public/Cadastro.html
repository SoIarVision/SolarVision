<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Cadastrar</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-conteudo">

            <div class="nav-logo">Solar<span>Vision</span></div>

            <div class="nav-links">
                <a href="Home.html" class="nav-ativo">Home</a>
                <a href="Home.html#Sobre">Sobre</a>
                <a href="Simulador.html">Simulador Financeiro</a>
                <a href="Login.html" class="nav-login">Logar</a>
                <a href="Cadastro.html" class="nav-cadastro">Cadastrar</a>
            </div>
        </div>
    </nav>

    <div id="div_mensagem" class="alerta"></div>

    <div id="div_cadastro" class="box">
        <h1>Cadastro - Empresa</h1>

        <div class="input_box">
            <span>Nome</span>
            <input type="text" id="val_nome" placeholder="Ex: João">
        </div>

        <div class="input_box">
            <span>Email</span>
            <input type="text" id="val_email" placeholder="seuemail@gmail.com">
        </div>

        <div class="input_box">
            <span>Senha</span>
            <input type="password" id="val_senha" placeholder="••••••••">
        </div>

        <div class="input_box">
            <span>Confirmar senha</span>
            <input type="password" id="val_confirmar" placeholder="••••••••">
        </div>

        <button onclick="cadastrar()">Cadastrar</button>
        <br><br>
    </div>

</body>

<script>
    function cadastrar() {

        let vazios = ""

        for (let i = 1; i <= 4; i++) {

            let valor = ""
            let nome = ""

            if (i == 1) {
                valor = val_nome.value.trim()
                nome = "Nome"
            }
            else if (i == 2) {
                valor = val_email.value.trim()
                nome = "Email"
            }
            else if (i == 3) {
                valor = val_senha.value.trim()
                nome = "Senha"
            }
            else if (i == 4) {
                valor = val_confirmar.value.trim()
                nome = "Confirmar senha"
            }

            if (valor == "") {
                if (vazios == "") {
                    vazios += nome
                } else {
                    vazios += ", " + nome
                }
            }
        }

        if (vazios != "") {
            div_mensagem.innerHTML = `Preencha: ${vazios}`
            div_mensagem.style.display = "flex"
            div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
            setTimeout(() => {
                div_mensagem.style.display = "none"
            }, 3000);
        }
        else {

            let nome = val_nome.value.trim()
            let email = val_email.value.trim()
            let senha = val_senha.value.trim()
            let confirmar = val_confirmar.value.trim()
            let erros = false

            if (nome.length < 3) {
                div_mensagem.innerHTML = "Nome deve conter 3 ou mais letras"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (!email.includes("@") || !email.includes(".")) {
                div_mensagem.innerHTML = "Email inválido"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (senha.length < 6) {
                div_mensagem.innerHTML = "Senha muito fraca"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (senha != confirmar) {
                div_mensagem.innerHTML = "Senhas divergentes"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (!/[a-z]/.test(senha) || !/[A-Z]/.test(senha)) {
                div_mensagem.innerHTML = "A senha deve ter pelo menos uma letra maiúscula e uma minúscula"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (!/[#@$*]/.test(senha)) {
                div_mensagem.innerHTML = "A senha deve ter pelo menos um caractere especial (@, #, $, *)"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (!erros) {
                div_mensagem.innerHTML = "Cadastro feito"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(0, 255, 0)";
                setTimeout(() => {
                    window.location = "Login.html"
                }, 3000);
            }
        }
    }
</script>

</html>
