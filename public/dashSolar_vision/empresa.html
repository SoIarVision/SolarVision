<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas - SolarVision</title>
    <script src="../js/sessao.js"> </script>

    <link rel="stylesheet" href="./CSS/style_empresa.css">
</head>

<body onload=" ajustarNavbarSessao(); validarSessao();">
    <nav class="navbar fechar" id="id_navbar">
        <div class="container nav-conteudo">

            <div class="nav-logo" id="logo_navbar">Solar<span>Vision</span></div>

            <div class="nav-links">
                <a id="nav_home" href="../index.html#Inicio" class="nav-ativo">Home</a>
                <a id="nav_sobre" href="../index.html#Sobre">Sobre</a>
                <a id="nav_simulador" href="Simulador.html">Simulador Financeiro</a>
                <a id="nav_dash" href="charjs.html">Dashboard</a>
                <a id="nav_logar" href="Login.html" class="nav-login">Logar</a>
                <a id="nav_cadastro" href="Cadastro.html" class="nav-cadastro">Cadastrar</a>
            </div>
        </div>
    </nav>

    <aside class="sidebar fechar" id="id_sidebar">
        <div class="sidebar-topo">
            <div class="nav-logo sidebar-logo">Solar<span>Vision</span></div>
            <button class="btn-menu-toggle" id="id_fechar">☰</button>
        </div>

        <ul class="menu">
            <li id="side_dashboard" class="menu-item"><a href="charjs.html">📊 <span
                        class="link-text">Dashboard</span></a></li>
            <li id="side_empresa" class="menu-item"><a href="#">🏤 <span class="link-text">Empresa</span></a>
            </li>
            <li id="side_suporte" class="menu-item"><a
                    href="https://sptech-team-tow3180n.atlassian.net/jira/core/form/cc4b1d0c-c490-4e68-a64e-a39c45acf177?atlOrigin=eyJpIjoiZjc2Mzc0OWEzOTk0NDI3OTk1YWI3MDdmYzk0NDlhNzUiLCJwIjoiaiJ9"
                    target="_blank">🆘 <span class="link-text">Suporte</span></a></li>
            <li id="side_manual" class="menu-item"><a href="./Manual.html">📖 <span class="link-text">Manual de
                        Instalação</span></a>
            </li>
        </ul>

        <div class="sidebar-bottom">
            <button class="btn-sair" id="btn_sair" onclick="limparSessao()">🚪 <span
                    class="link-text">Logout</span></button>
        </div>
    </aside>

    <div class="conteudo_principal fechar" id="id_conteudo_principal">
        <div class="container">
            <h1 class="titulo_pagina" id="titulo_empresas">Empresas</h1>
            <h1 class="titulo_pagina" id="titulo_funcionarios">Funcionários</h1>

            <section class="secao_empresas">
                <h2 class="titulo_secao">Empresas Cadastradas</h2>
                <div class="lista_empresas" id="lista_empresas">
                </div>
            </section>

            <section class="secao_funcionarios">
                <h2 class="titulo_secao">Funcionários</h2>
                <div class="grid_funcionarios" id="grid_funcionarios">
                </div>
        </div>
        </section>
    </div>
    </div>
</body>
<script>
    const idEmpresa = sessionStorage.ID_EMPRESA;
    const cargo = sessionStorage.CARGO_USUARIO;

    const secaoEmpresas = document.querySelector(".secao_empresas");
    const secaoFuncionarios = document.querySelector(".secao_funcionarios");
    const titulo_func = document.getElementById("titulo_funcionarios")
    const titulo_empresa = document.getElementById("titulo_empresas")

    if (cargo.trim() === "Administrador") {
        titulo_func.style.display = "none"
        secaoFuncionarios.style.display = "none";
        fetch("/empresas/listar/empresas")
            .then((resposta) => resposta.json())
            .then((empresas) => {
                var container = document.getElementById("lista_empresas")
                container.innerHTML = "";
                empresas.forEach((empresa) => {
                    container.innerHTML += `
                    <div class="card_empresa">
                        <div class="empresa_header">
                            <h3 class="nome_empresa">${empresa.Nome}</h3>
                        </div>
                        
                        <div class="empresa_info_grid">
                            <div class="empresa_info_item">
                                <span class="info_label">Representante</span>
                                <span class="info_valor">${empresa.Representante}</span>
                            </div>
    
                            <div class="empresa_info_item">
                                <span class="info_label">Local</span>
                                <span class="info_valor">${empresa.localidade}</span>
                            </div>
    
                            <div class="empresa_info_item">
                                <span class="info_label">Quantidade de Placas</span>
                                <span class="info_valor info_destaque">${empresa.Placas}</span>
                            </div>
    
                            <div class="empresa_info_item">
                                <span class="info_label">Quantidade de Funcionários</span>
                                <span class="info_valor info_destaque">${empresa.Funcionarios}</span>
                            </div>
    
                            <div class="empresa_info_item">
                                <span class="info_label">Contato</span>
                                <span class="info_valor">${empresa.Contato}</span>
                            </div>
                        </div>
                    </div>`
                })
            });
    }
    else if (cargo.trim() === "Gerente") {
        titulo_empresa.style.display = "none"
        secaoEmpresas.style.display = "none";

        fetch(`/empresas/funcionarios/listar/${idEmpresa}`)
            .then((resposta) => resposta.json())
            .then((funcionario) => {
                var container = document.getElementById("grid_funcionarios")
                container.innerHTML = "";
                funcionario.forEach((funcionario) => {
                    container.innerHTML += `
                        <div class="card_funcionario">
                        <h3 class="nome_funcionario">${funcionario.Nome}</h3>
    
                        <div class="funcionario_info">
                            <div class="funcionario_campo">
                                <span class="funcionario_label">Cargo</span>
                                <span class="funcionario_valor">${funcionario.Cargo}</span>
                            </div>
    
                            <div class="funcionario_campo">
                                <span class="funcionario_label">Contato</span>
                                <span class="funcionario_valor">${funcionario.Telefone}</span>
                            </div>
                        </div>
                    </div>`
                })
            });
    }

    else {
        window.location = 'charjs.html'
    }

    document.getElementById("id_fechar").addEventListener("click", function () {

        document.getElementById("id_sidebar").classList.toggle("fechar");
        document.getElementById("id_conteudo_principal").classList.toggle("fechar");
        document.getElementById("id_navbar").classList.toggle("fechar");



        if (document.getElementById("id_navbar").classList.contains("fechar")) {
            document.getElementById("logo_navbar").style.display = "block";
        } else {
            document.getElementById("logo_navbar").style.display = "none";
        }
    });
</script>

</html>
