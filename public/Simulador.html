<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>SolarVision</title>
</head>

<body onload=" ajustarNavbarSessao();">
    <nav class="navbar">
        <div class="container nav-conteudo">

            <div class="nav-logo">Solar<span>Vision</span></div>

            <div class="nav-links">
                <a id="nav_home" href="#Inicio" class="nav-ativo">Home</a>
                <a id="nav_sobre" href="#Sobre">Sobre</a>
                <a id="nav_simulador" href="Simulador.html">Simulador Financeiro</a>
                <a id="nav_dash" href="./dashSolar_vision/charjs.html">Dashboard</a>s
                <a id="nav_logar" href="Login.html" class="nav-login">Logar</a>
                <a id="nav_cadastro" href="Cadastro.html" class="nav-cadastro">Cadastrar</a>
            </div>
        </div>
    </nav>

    <div class="box">
        <h1>Simulador Financeiro</h1>

        <div class="input_box">
            <span>Consumo médio mensal de energia (kWh):</span>
            <input type="text" id="val_geracao" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Tarifa de energia (R$/kWh):</span>
            <input type="text" id="val_tarifa" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Eficiência dos painéis (afetados por soiling):</span>
            <input type="text" id="val_eficiencia" placeholder=" ">
        </div>

        <button onclick="calcular()">Calcular</button>
        <button onclick="limpar()">Limpar</button>

        <br><br>

        <div id="div_economia" class="economia"></div>
    </div>
</body>

<script>
    var id_user = sessionStorage.ID_USUARIO;
    if (!id_user) {
        dash.style.display = 'none'
    }
    if (id_user) {
        dash.style.display = 'block'
        home.style.display = 'none'
        sobre.style.display = 'none'
        login.style.display = 'none'
        cadastro.style.display = 'none'
    }

    function calcular() {
        let consumo = Number(val_geracao.value)
        let tarifa = Number(val_tarifa.value)
        let eficiencia = Number(val_eficiencia.value)



        if (val_geracao.value == "") {
            alert("Insira o consumo mensal de energia")
        }

        if (val_tarifa.value == "") {
            tarifa = 1
        }

        if (val_eficiencia.value == "") {
            eficiencia = 80
        }

        let status = ""

        if (eficiencia >= 90 && eficiencia <= 100) {
            status = "Painéis limpos ✅"
        }
        else if (eficiencia >= 70) {
            status = "Atenção: possível sujeira ⚠️"
        }
        else if (eficiencia < 70) {
            status = "🚨 Limpeza recomendada imediatamente!"
        }

        if (eficiencia > 100) {
            alert("A eficiência não deve ser maior que 100%")
            val_geracao.value = ""
            val_tarifa.value = ""
            val_eficiencia.value = ""
        }
        else if (eficiencia <= 0) {
            alert("A eficiência não deve ser menor que 1%")
            val_geracao.value = ""
            val_tarifa.value = ""
            val_eficiencia.value = ""
        }

        let consumoAtual = consumo * (eficiencia / 100)
        let economiaIdeal = consumo * tarifa
        let economiaAtual = consumoAtual * tarifa

        let perdaKwh = consumo - consumoAtual
        let perdaDinheiro = economiaIdeal - economiaAtual
        let perdaAnual = perdaDinheiro * 12

        if (eficiencia < 100 && eficiencia > 0 && consumo > 0) {

            div_economia.style.display = "block"

            div_economia.innerHTML = `<b>Resultado:</b><br><br>

            Consumo ideal: ${consumo.toFixed(2)} kWh<br>
            Consumo considerando eficiência: ${consumoAtual.toFixed(2)} kWh<br><br>

            Economia ideal: R$ ${economiaIdeal.toFixed(2)}<br>
            Economia atual: R$ ${economiaAtual.toFixed(2)}<br><br>

            <b>
            Você está jogando R$ ${perdaDinheiro.toFixed(2)} fora TODO MÊS e R$ ${perdaAnual.toFixed(2)} POR ANO sem a SolarVision.
            </b><br><br>

            Isso indica possível acúmulo de soiling nos painéis, reduzindo a captação de luz.
            <br>
            A SolarVision detecta isso automaticamente e te avisa antes do prejuízo aumentar.
            <br>
            <b>Status do sistema:</b> ${status}<br><br>
            `

        }
        else if (eficiencia == 100) {
            div_economia.style.display = "block"
            div_economia.innerHTML = `
        <b>Resultado:</b><br><br>

        Consumo ideal: ${consumo.toFixed(2)} kWh<br>
        Consumo considerando eficiência: ${consumoAtual.toFixed(2)} kWh<br><br>

        Economia ideal: R$ ${economiaIdeal.toFixed(2)}<br>
        Economia atual: R$ ${economiaAtual.toFixed(2)}<br><br>
        `
        }

        else {
            div_economia.innerHTML = ``
            div_economia.style.display = "none"
        }

    }

    function limpar() {
        val_geracao.value = ""
        val_tarifa.value = ""
        val_eficiencia.value = ""
        div_economia.innerHTML = ""

        div_economia.style.display = "none"
    }
</script>

</html>
