<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login</title>
</head>

<body onload=" ajustarNavbarSessao();">
  <nav class="navbar">
    <div class="container nav-conteudo">

      <div class="nav-logo">Solar<span>Vision</span></div>

      <div class="nav-links">
        <a href="./index.html" class="nav-ativo">Home</a>
        <a href="./index.html#Sobre">Sobre</a>
        <a href="Simulador.html">Simulador Financeiro</a>
        <a href="Login.html" class="nav-login">Logar</a>
        <a href="Cadastro.html" class="nav-cadastro">Cadastrar</a>
      </div>
    </div>
  </nav>

    <div id="div_mensagem" class="alerta"></div>


    <div id="div_cadastro" class="box">
        <h1>Login</h1>

        <div class="input_box">
            <span>Email</span>
            <input type="text" id="val_email" placeholder="seuemail@gmail.com">
        </div>

        <div class="input_box">
            <span>Senha</span>
            <input type="password" id="val_senha" placeholder="••••••••">
        </div>

        <button onclick="logar()">Logar</button>
        <br><br>
    </div>

</body>

<script>

    function mostrarErro(mensagem) {
        div_mensagem.textContent = mensagem;
        div_mensagem.style.display = 'block';
        div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
        setTimeout(() => div_mensagem.style.display = 'none', 3000);
    }

    function mostrarCerto(mensagem) {
        div_mensagem.textContent = mensagem;
        div_mensagem.style.display = 'block';
        div_mensagem.style.borderLeft = "10px solid rgb(0, 255, 0)"
        setTimeout(() => div_mensagem.style.display = 'none', 3000);
    }

    function logar() {

        let vazios = ""

        for (let i = 1; i <= 2; i++) {

            let valor = ""
            let nome = ""

            if (i == 1) {
                valor = val_email.value.trim()
                nome = "Email"
            } else if (i == 2) {
                valor = val_senha.value.trim()
                nome = "Senha"
            }

            if (valor == "") {
                if (vazios == "") {
                    vazios += nome
                }
                else {
                    vazios += ", " + nome
                }
            }
        }

        if (vazios != "") {
            div_mensagem.innerHTML = `Preencha: ${vazios}`
            div_mensagem.style.display = "flex"
            div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
            setTimeout(() => {
                div_mensagem.style.display = "none"
            }, 3000);
        }
        else {
            let email = val_email.value.trim()
            let senha = val_senha.value.trim()
            let erros = false

            if (!email.includes("@") || !email.includes(".")) {
                div_mensagem.innerHTML = "Email inválido"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (senha.length < 6) {
                div_mensagem.innerHTML = "Senha incorreta"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (!/[a-z]/.test(senha) || !/[A-Z]/.test(senha)) {
                div_mensagem.innerHTML = "A senha deve ter pelo menos uma letra maiúscula e uma minúscula"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (!/[#@$*]/.test(senha)) {
                div_mensagem.innerHTML = "A senha deve ter pelo menos um caractere especial (@, #, $, *)"
                div_mensagem.style.display = "flex"
                div_mensagem.style.borderLeft = "10px solid rgb(255, 0, 0)"
                setTimeout(() => {
                    div_mensagem.style.display = "none"
                }, 3000);
                erros = true
            }

            if (!erros) {
                fetch('/usuarios/autenticar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        emailServer: email,
                        senhaServer: senha
                    })
                })
                    .then(function (resposta) {

                        if (!resposta.ok) {
                            throw new Error('Email ou senha inválidos!');
                        }

                        return resposta.json();

                    })
                    .then(function (dados) {

                        console.log("Dados recebidos:", dados);
                        console.log("Empresa recebida:", dados.empresa);

                        sessionStorage.EMAIL_USUARIO = dados.email;
                        sessionStorage.NOME_USUARIO = dados.nome;
                        sessionStorage.ID_USUARIO = dados.id;
                        sessionStorage.CARGO_USUARIO = dados.cargo;
                        sessionStorage.ID_EMPRESA = dados.empresa;

                        console.log("Session empresa:", sessionStorage.ID_EMPRESA);

                        mostrarCerto('Login realizado! Redirecionando...');

                        setTimeout(() => {
                            window.location = './dashSolar_vision/charjs.html';
                        }, 1500);

                    })
                    .catch(function (erro) {
                        console.error(erro);
                        mostrarErro(erro.message || 'Erro de conexão. Tente novamente.');
                    });
            }
        }
    }
</script>

</html>
