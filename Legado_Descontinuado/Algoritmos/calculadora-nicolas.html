<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SolarVision - Análise de Sujeira</title>
</head>

<body>

<h1>Análise de Sujeira em Painéis Solares</h1>

<div>

Luminosidade externa (sensor referência):  
<input id="ipt_luz_externa"><br><br>

Luminosidade no painel solar:  
<input id="ipt_luz_painel"><br><br>

Produção mensal do sistema (kWh):  
<input id="ipt_producao"><br><br>

Tarifa de energia (R$/kWh):  
<input id="ipt_tarifa"><br><br>

</div>

<button onclick="analisar()">Analisar painel</button>
<button onclick="limpar()">Limpar</button>

<br><br>

<div id="div_resultado"></div>

</body>

<script>

function analisar(){

let luzExterna = Number(ipt_luz_externa.value)
let luzPainel = Number(ipt_luz_painel.value)
let producao = Number(ipt_producao.value)
let tarifa = Number(ipt_tarifa.value)

if(ipt_luz_externa.value == "" || ipt_luz_painel.value == "" || ipt_producao.value == ""){
alert("Preencha os dados de luminosidade e produção.")
return
}

if(ipt_tarifa.value == ""){
tarifa = 1
}

let eficiencia = (luzPainel / luzExterna) * 100

let perdaPercentual = 100 - eficiencia

let perdaEnergia = producao * (perdaPercentual/100)

let prejuizo = perdaEnergia * tarifa

div_resultado.innerHTML = `

Eficiência do painel: <b>${eficiencia.toFixed(1)}%</b><br><br>

Perda causada por sujeira: <b>${perdaPercentual.toFixed(1)}%</b><br><br>

Energia perdida no mês: <b>${perdaEnergia.toFixed(2)} kWh</b><br><br>

Prejuízo financeiro mensal: <b>R$ ${prejuizo.toFixed(2)}</b>

`

}

function limpar(){

ipt_luz_externa.value=""
ipt_luz_painel.value=""
ipt_producao.value=""
ipt_tarifa.value=""
div_resultado.innerHTML=""

}

</script>

</html>
