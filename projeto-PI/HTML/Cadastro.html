<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Cadastrar</title>
</head>

<body>
    <header>
        <img src="../ASSETS/TESTE.png" alt="" class="logo">
        <h1 class="titulo">SolarVision</h1>

        <div class="anchor">
            <a href="site.html">Home</a>
            <a href="">Sobre</a>
            <a href="Calculadora-SP_2.html">Calculadora</a>
            <a href="Cadastro.html">Cadastro</a>
            <a href="Login.html">Login</a>
        </div>

    </header>

    <div id="div_cadastro" class="container">
        <h1>Cadastro - Empresa</h1>

        <div class="input_box">
            <span>Nome</span>
            <input type="text" id="val_nome" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Email</span>
            <input type="text" id="val_email" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Senha</span>
            <input type="password" id="val_senha" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Confirmar senha</span>
            <input type="password" id="val_confirmar" placeholder=" ">
        </div>

        <button onclick="cadastrar()">Cadastrar</button>
        <br><br>
    </div>

</body>

<script>
function cadastrar() {

    let nome = val_nome.value.trim()
    let email = val_email.value.trim()
    let senha = val_senha.value.trim()
    let confirmar = val_confirmar.value.trim()
    let erros = false
    
    if (nome == "" || email == "" || senha == "" || confirmar == "") {
        alert("Preencha todos os campos")
        erros = true
    }

    if (nome.length < 3) {
        alert("Nome muito curto")
    }

    if (!email.includes("@") || !email.includes(".")) {
        alert("Email inválido")
        erros = true
    }

    if (senha.length < 6) {
        alert("Senha deve ter no mínimo 6 caracteres")
        erros = true
    }

    if (senha != confirmar) {
        alert("Senhas não coincidem")
        erros = true
    }

    if (erros == false) {
        alert("Cadastro realizado")
    }
    
}
</script>

</html>
