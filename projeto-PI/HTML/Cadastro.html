<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Cadastrar</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-conteudo">

            <div class="nav-logo">Solar<span>Vision</span></div>

            <div class="nav-links">
                <a href="Home.html" class="nav-ativo">Home</a>
                <a href="Home.html#Sobre">Sobre</a>
                <a href="Calculadora-SP_2.html">Simulador Financeiro</a>
                <a href="Login.html" class="nav-login">Logar</a>
                <a href="Cadastro.html" class="nav-cadastro">Cadastrar</a>
            </div>
        </div>
    </nav>

    <div id="div_cadastro" class="box">
        <h1>Cadastro - Empresa</h1>

        <div class="input_box">
            <span>Nome</span>
            <input type="text" id="val_nome" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Email</span>
            <input type="text" id="val_email" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Senha</span>
            <input type="password" id="val_senha" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Confirmar senha</span>
            <input type="password" id="val_confirmar" placeholder=" ">
        </div>

        <button onclick="cadastrar()">Cadastrar</button>
        <br><br>
    </div>

</body>

<script>
    function cadastrar() {

        let vazios = ""

        for (let i = 1; i <= 4; i++) {

            let valor = ""
            let nome = ""

            if (i == 1) {
                valor = val_nome.value.trim()
                nome = "Nome"
            }
            else if (i == 2) {
                valor = val_email.value.trim()
                nome = "Email"
            }
            else if (i == 3) {
                valor = val_senha.value.trim()
                nome = "Senha"
            }
            else if (i == 4) {
                valor = val_confirmar.value.trim()
                nome = "Confirmar senha"
            }

            if (valor == "") {
                if (vazios == "") {
                    vazios += nome
                } else {
                    vazios += ", " + nome
                }
            }
        }

        if (vazios != "") {
            alert("Preencha: " + vazios)
        }
        else {

            let nome = val_nome.value.trim()
            let email = val_email.value.trim()
            let senha = val_senha.value.trim()
            let confirmar = val_confirmar.value.trim()
            let erros = false

            if (nome.length < 3) {
                alert("Nome deve conter 3 ou mais letras")
                erros = true
            }

            if (!email.includes("@") || !email.includes(".")) {
                alert("Email inválido")
                erros = true
            }

            if (senha.length < 6) {
                alert("Senha muito fraca")
                erros = true
            }

            if (senha != confirmar) {
                alert("Senhas divergentes")
                erros = true
            }

            if (!erros) {
                alert("Cadastro feito")
            }
        }
    }
</script>

</html>
