<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Cadastrar</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-conteudo">

            <div class="nav-logo">Solar<span>Vision</span></div>

            <div class="nav-links">
                <a href="Home.html" class="nav-ativo">Home</a>
                <a href="Home.html#Sobre">Sobre</a>
                <a href="Calculadora-SP_2.html">Simulador Financeiro</a>
                <a href="Login.html" class="nav-login">Logar</a>
                <a href="Cadastro.html" class="nav-cadastro">Cadastrar</a>
            </div>
        </div>
    </nav>

    <div id="div_cadastro" class="box">
        <h1>Cadastro - Empresa</h1>

        <div class="input_box">
            <span>Nome</span>
            <input type="text" id="val_nome" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Email</span>
            <input type="text" id="val_email" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Senha</span>
            <input type="password" id="val_senha" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Confirmar senha</span>
            <input type="password" id="val_confirmar" placeholder=" ">
        </div>

        <button onclick="cadastrar()">Cadastrar</button>
        <br><br>
    </div>

</body>

<script>
    function cadastrar() {

        let nome = val_nome.value.trim()
        let email = val_email.value.trim()
        let senha = val_senha.value.trim()
        let confirmar = val_confirmar.value.trim()
        let erros = false

        if (nome == "" || email == "" || senha == "" || confirmar == "") {
            alert("Preencha todos os campos")
            erros = true
        }

        if (nome.length < 3) {
            alert("Nome muito curto")
        }

        if (!email.includes("@") || !email.includes(".")) {
            alert("Email inválido")
            erros = true
        }

        if (senha.length < 6) {
            alert("Senha deve ter no mínimo 6 caracteres")
            erros = true
        }

        if (senha != confirmar) {
            alert("Senhas não coincidem")
            erros = true
        }

        if (erros == false) {
            alert("Cadastro realizado")
        }

    }
</script>

</html>
