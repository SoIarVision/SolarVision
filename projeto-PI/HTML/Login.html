<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Login</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-conteudo">

            <div class="nav-logo">Solar<span>Vision</span></div>

            <div class="nav-links">
                <a href="Home.html" class="nav-ativo">Home</a>
                <a href="Home.html#Sobre">Sobre</a>
                <a href="Calculadora-SP_2.html">Simulador Financeiro</a>
                <a href="Login.html" class="nav-login">Logar</a>
                <a href="Cadastro.html" class="nav-cadastro">Cadastrar</a>
            </div>
        </div>
    </nav>

    <div id="div_cadastro" class="box">
        <h1>Login</h1>

        <div class="input_box">
            <span>Email</span>
            <input type="text" id="val_email" placeholder=" ">
        </div>

        <div class="input_box">
            <span>Senha</span>
            <input type="text" id="val_senha" placeholder=" ">
        </div>

        <button onclick="logar()">Logar</button>
        <br><br>
    </div>

</body>

<script>
    function logar() {

        let vazios = ""

        for (let i = 1; i <= 2; i++) {

            let valor = ""
            let nome = ""

            if (i == 1) {
                valor = val_email.value.trim()
                nome = "Email"
            } else if (i == 2) {
                valor = val_senha.value.trim()
                nome = "Senha"
            }

            if (valor == "") {
                if (vazios == "") {
                    vazios += nome
                }
                else {
                    vazios += ", " + nome
                }
            }
        }

        if (vazios != "") {
            alert("Preencha: " + vazios)
        }
        else {
            let email = val_email.value.trim()
            let senha = val_senha.value.trim()
            let erros = false

            if (!email.includes("@") || !email.includes(".")) {
                alert("Email inválido")
                erros = true
            }

            if (senha.length < 6) {
                alert("Senha incorreta")
                erros = true
            }

            if (!erros) {
                alert("Login OK")
                window.location = "../dashSolar_vision/charjs.html"

            }
        }
    }
</script>

</html>
