<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
</head>

<body>
    <header>
        <img src="../ASSETS/TESTE.png" alt="" class="logo">
        <h1 class="titulo">SolarVision</h1>

        <div class="anchor">
        <a href="site.html">Home</a>

        <a href="Calculadora-SP_2.html">Calculadora</a>
        <a href="Cadastro.html">Cadastro</a>
        <a href="Login.html">Login</a>
        </div>
    
    </header>

    <div id="div_cadastro" class="container">
        <h1>Login</h1>
        
        <div class="input_box">
            <span>Email</span>
            <input type="text" id="val_email" placeholder=" ">
        </div>
        
        <div class="input_box">
            <span>Senha</span>
            <input type="text" id="val_senha" placeholder=" ">
        </div>
        
        <button onclick="logar()">Logar</button>
        <br><br>
    </div>
    
</body>

<script>
function logar() {
    let email = val_email.value.trim()
    let senha = val_senha.value.trim()

    if (email == "" || senha == "") {
        alert("Preencha todos os campos")
    }

    if (!email.includes("@") || !email.includes(".")) {
        alert("Email inválido")
    }

    if (senha.length < 6) {
        alert("Senha muito curta (mín 6)")
    }
    else{
        alert("Login OK")
    }
    
}
</script>

</html>
